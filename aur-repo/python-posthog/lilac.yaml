maintainers:
  - github: taotieren
    email: admin@taotieren.com
build_prefix: aur-repo-x86_64
pre_build_script: |
  aur_pre_build(maintainers=['envolution'])
  run_cmd(['curl', '-L', '-o', 'PKGBUILD', 'https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=python-posthog'])
  run_cmd(['sed', '-i', 's/check()/_check()/', 'PKGBUILD'])
  run_cmd(['updpkgsums'])
post_build: aur_post_build
repo_depends:
  - python-backoff
  - python-anthropic
  - python-google-genai
update_on:
  - source: aur
    aur: python-posthog
  - alias: python
