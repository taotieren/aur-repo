maintainers:
  - github: taotieren
    email: admin@taotieren.com
build_prefix: aur-repo-x86_64
pre_build_script: |
  update_pkgver_and_pkgrel(_G.newver)
post_build_script: |
  git_pkgbuild_commit()
  update_aur_repo()
repo_depends:
  - python-k3ut
  - k3awssign
  - k3confloader
  - k3http
  - k3utfjson
  - python-k3utdocker
  - python-k3thread

update_on:
  - source: github
    github: pykit3/k3redisutil
    use_max_tag: true
    prefix: v
  - alias: python
