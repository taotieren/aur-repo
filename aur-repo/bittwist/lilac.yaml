maintainers:
  - github: taotieren
    email: admin@taotieren.com
pre_build_script: |
  update_pkgver_and_pkgrel(_G.newver)
post_build_script: |
  git_pkgbuild_commit()
  update_aur_repo()
update_on:
  - source: regex
    url: https://bittwist.sourceforge.io/ http://plib.sourceforge.net/download.html
    regex: 'bittwist-linux-([0-9.]+)\.tar\.gz'