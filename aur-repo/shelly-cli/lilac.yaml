maintainers:
  - github: taotieren
    email: admin@taotieren.com
pre_build_script: |
  aur_pre_build(maintainers=['ZoeyErinBauer'])
  add_makedepends(['ripgrep'])
  
  run_cmd(['curl', '-L', '-o', 'PKGBUILD', 'https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=shelly-cli'])
  run_cmd(['sed', '-i', 's/zig=[0-9.]+/zig/g', 'PKGBUILD'])
  run_cmd(['updpkgsums'])
post_build: aur_post_build
# repo_depends:
#   - 
update_on:
  - source: aur
    aur: shelly-cli
