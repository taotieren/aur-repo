maintainers:
  - github: taotieren
    email: admin@taotieren.com
build_prefix: aur-repo-x86_64
pre_build_script: |
  oldver, oldrel = get_pkgver_and_pkgrel()
  for line in edit_file('PKGBUILD'):
    if line.startswith('_tagname='):
      line = f"_tagname={_G.newver}"
    print(line)
  newver, newrel = get_pkgver_and_pkgrel()
  update_pkgrel(1 if newver != oldver else None)
  run_protected(["updpkgsums"])
post_build_script: |
  git_pkgbuild_commit()
  update_aur_repo()
# repo_depends:
#   - 
update_on:
  - source: github
    github: wjakob/nanobind
    use_max_tag: true
    include_regex: 'backend-v([\d.]+)'
    exclude_regex: "^v*"
  - alias: python
