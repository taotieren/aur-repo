maintainers:
  - github: taotieren
    email: admin@taotieren.com
build_prefix: aur-repo-x86_64
pre_build_script: |
  update_pkgver_and_pkgrel(_G.newver)
post_build_script: |
  git_pkgbuild_commit()
repo_depends:
  - cc65-git
update_on:
  - source: github
    github: OpenCBM/OpenCBM
    # use_max_tag: true
    use_latest_tag: true
    prefix: v
    exclude_regex: ".*_*"
