maintainers:
  - github: taotieren
    email: admin@taotieren.com
pre_build_script: |
  oldver, oldrel = get_pkgver_and_pkgrel()
  for line in edit_file('PKGBUILD'):
    if line.startswith('_tagname='):
      line = f"_tagname={_G.newver}"
    print(line)
  newver, newrel = get_pkgver_and_pkgrel()
  update_pkgrel(1 if newver != oldver else None)
post_build_script: |
  git_pkgbuild_commit()
  update_aur_repo()
# repo_depends:
#   -
update_on:
  - source: regex
    url: https://github.com/dmBots/motor-debugging-tool/tree/master/Linux/x86_64
    regex: 'DMTool-v([0-9.]+(?:-[a-zA-Z0-9.]+)?)-x86_64'
    user_agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
