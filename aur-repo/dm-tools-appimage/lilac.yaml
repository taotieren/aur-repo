maintainers:
  - github: taotieren
    email: admin@taotieren.com
pre_build_script: |
  oldver, oldrel = get_pkgver_and_pkgrel()
  for line in edit_file('PKGBUILD'):
    if line.startswith('_tagname='):
      line = f"_tagname={_G.newver}"
    print(line)
  newver, newrel = get_pkgver_and_pkgrel()
  update_pkgrel(1 if newver != oldver else None)
post_build_script: |
  git_pkgbuild_commit()
  update_aur_repo()
# repo_depends:
#   -
update_on:
  - source: cmd
    cmd: "curl -sL 'https://api.github.com/repos/dmBots/motor-debugging-tool/contents/Linux/x86_64' | grep -oE 'DMTool-v[0-9.]+(-[a-zA-Z0-9.]+)?-x86_64' | head -1 | sed -e 's/^DMTool-v//' -e 's/-x86_64$//'"
