maintainers:
  - github: taotieren
    email: admin@taotieren.com
build_prefix: aur-repo-x86_64
pre_build_script: |
  update_pkgver_and_pkgrel(_G.newver)
post_build_script: |
  git_pkgbuild_commit()
  update_aur_repo()
repo_depends:
  - python-kicad
  - python-kicad-sch-api
update_on:
  - source: github
    github: oaslananka/kicad-mcp-pro
    use_max_tag: true
    # use_latest_release: true
    include_regex: '(?i)(-mcp-gui|gui).*'
    exclude_regex: "(?i)(mcp-npm|mcp-server|npm|server).*"
    prefix: kicad-mcp-gui-v
  - alias: python
