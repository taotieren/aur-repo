maintainers:
  - github: taotieren
    email: admin@taotieren.com
pre_build_script: |
  aur_pre_build(maintainers=['Rainbowu'])
  
  run_cmd(['curl', '-L', '-o', 'PKGBUILD', 'https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=workbuddy'])

  run_cmd(['sed', '-i', 's/pkgver()/_pkgver()/', 'PKGBUILD'])

  run_cmd(['updpkgsums'])
post_build: aur_post_build
# repo_depends:
#   -
update_on:
  - source: aur
    aur: workbuddy
