maintainers:
  - github: taotieren
    email: admin@taotieren.com
build_prefix: aur-repo-x86_64
pre_build_script: |
  update_pkgver_and_pkgrel(_G.newver)
post_build_script: |
  git_pkgbuild_commit()
  update_aur_repo()
update_on:
  - source: github
    github: cloud-fs/clouddrive-mediaserver-plugin
    use_latest_release: true
    include_regex: '^v\d[\d.]*$'
    prefix: v

# use_max_tag: true
# prefix: v
