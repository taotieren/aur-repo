maintainers:
  - github: taotieren
    email: admin@taotieren.com
build_prefix: aur-repo-x86_64
pre_build_script: |
  aur_pre_build(maintainers=['zxp19821005', 'ihipop'])

  run_cmd(['curl', '-L', '-o', 'PKGBUILD', 'https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=eusoft-eudic-bin'])

  run_cmd(['sed', '-i', 's/pkgver()/_pkgver()/', 'PKGBUILD'])

  run_cmd(['updpkgsums'])
post_build: aur_post_build
update_on:
  - source: aur
    aur: eusoft-eudic-bin
