maintainers:
  - github: taotieren
    email: admin@taotieren.com
build_prefix: aur-repo-x86_64
pre_build_script: aur_pre_build(maintainers='xiota')
post_build: aur_post_build
update_on:
  - source: aur
    aur: sourcetrail
  # 基于 soname 的自动触发：boost-libs 升级改变 libboost_*.so 的 ABI 版本号时自动重建，
  # 避免 libboost_*.so=1.91.0-64 这类依赖冲突。aur 触发只看版本号、对纯 ABI 破坏性升级
  # 无感，故额外监听 boost-libs 提供的 soname（strip_release 去掉 -64 只看主版本）。
  - source: alpm
    alpm: boost-libs
    provided: libboost_filesystem.so
    strip_release: true
  - source: alpm
    alpm: boost-libs
    provided: libboost_locale.so
    strip_release: true
  - source: alpm
    alpm: boost-libs
    provided: libboost_program_options.so
    strip_release: true
