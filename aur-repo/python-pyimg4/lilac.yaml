maintainers:
  - github: taotieren
    email: admin@taotieren.com
build_prefix: aur-repo-x86_64
pre_build_script: aur_pre_build(maintainers='haxibami')
post_build: aur_post_build
repo_depends:
  - python-apple-compress
  - python-asn1
  - python-lzfse
  - python-pylzss
  - python-remotezip
update_on:
  - source: aur
    aur: python-pyimg4
  - alias: python
