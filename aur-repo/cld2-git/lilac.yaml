maintainers:
  - github: taotieren
    email: admin@taotieren.com
pre_build_script: |
  aur_pre_build(maintainers=['Beini'])

  run_cmd(['curl', '-L', '-o', 'PKGBUILD', 'https://aur.archlinux.org/cgit/aur.git/plain/CMakeLists.txt?h=cld2-git'])

  run_cmd(['sed', '-i', 's/cmake_minimum_required(VERSION 2.8.12)/cmake_minimum_required(VERSION 3.5)/', 'CMakeLists.txt'])

  run_cmd(['updpkgsums'])
post_build_script: aur_post_build
update_on:
  - source: aur
    aur: cld2-git
