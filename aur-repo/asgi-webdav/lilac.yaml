build_prefix: aur-repo-x86_64
pre_build_script: |
  update_pkgver_and_pkgrel(_G.newver)
post_build_script: |
  git_pkgbuild_commit()
# update_aur_repo()
repo_depends:
  - python-asgi-middleware-static-file
  - python-dataclass-wizard
  - python-httpx-kerberos
update_on:
  - source: github
    github: rexzhang/asgi-webdav
    use_max_tag: true
    prefix: v
  - alias: python