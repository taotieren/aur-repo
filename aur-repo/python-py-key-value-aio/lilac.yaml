maintainers:
  - github: taotieren
    email: admin@taotieren.com
build_prefix: aur-repo-x86_64
pre_build_script: |
  update_pkgver_and_pkgrel(_G.newver)
  # Fetch/extract the git source first: gen_meta.sh reads
  # src/py_key_value_aio/pyproject.toml from that checkout.
  run_protected(["makepkg", "-o", "--nobuild"])
  # Only regenerates the meta-package blocks; no source fetching of its own.
  run_protected(["./gen_meta.sh"])
  
post_build_script: |
  git_pkgbuild_commit()
  update_aur_repo()
repo_depends:
  - python-beartype
update_on:
  - source: github
    github: strawgate/py-key-value
    use_max_tag: true
  - alias: python
