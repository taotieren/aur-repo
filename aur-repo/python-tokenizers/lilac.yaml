maintainers:
  - github: taotieren
    email: admin@taotieren.com
pre_build_script: |
  aur_pre_build(maintainers=['xiota', 'daskol'])
  run_cmd(['curl', '-L', '-o', 'PKGBUILD', 'https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=python-tokenizers'])

  run_cmd(['sed', '-i', 's/check()/_check()/', 'PKGBUILD'])

  run_cmd(['updpkgsums'])
post_build: aur_post_build
# repo_depends:
#   -
update_on:
  - source: aur
    aur: python-tokenizers
  - alias: python
time_limit_hours: 3