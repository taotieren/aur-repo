maintainers:
  - github: taotieren
    email: admin@taotieren.com
pre_build_script: |
  aur_pre_build(maintainers=['ZoeyErinBauer', 'caroberrie'])

  run_cmd(['curl', '-L', '-o', 'PKGBUILD', 'https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=shelly'])
  run_cmd(['sed', '-i', '-E',  r"s/(['\"])zig[><=]+[0-9][0-9.]*\1/\1zig\1/g", 'PKGBUILD'])
  run_cmd(['updpkgsums'])
post_build: aur_post_build
# repo_depends:
#   - 
update_on:
  - source: aur
    aur: shelly
