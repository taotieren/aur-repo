pre_build_script: |
  update_pkgver_and_pkgrel(_G.newver)
post_build_script: |
  git_pkgbuild_commit()
  update_aur_repo()
update_on:
  - source: cmd
    cmd: |
      python3 << 'PYEOF'
      import urllib.request, re

      url = "https://www.gd32mcu.com/download/down/document_id/530/path_type/1"
      req = urllib.request.Request(
          url, method="HEAD", headers={"User-Agent": "Mozilla/5.0"}
      )
      try:
          r = urllib.request.urlopen(req, timeout=30)
      except Exception:
          r = urllib.request.urlopen(url, timeout=30)
      # document_id/530 is the GD32 ISP Console(Linux) download entry; it
      # redirects to the versioned tarball URL carrying the latest version.
      final = r.geturl()
      m = re.search(r"GD32_ISP_CLI_Linux_V([\d.]+)\.tar\.gz", final)
      if m:
          print(m.group(1))
      PYEOF
# - source: manual
#   manual: 1
